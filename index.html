<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMA Podcast - Repaso Oposiciones</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
  <link rel="apple-touch-icon" href="icono-192.png">
</head>
<body>

  <!-- Pantalla de bloqueo hasta iniciar sesión -->
  <div id="login-overlay" style="display:none; position:fixed; inset:0; background:#121212; z-index:9999; flex-direction:column; align-items:center; justify-content:center; padding:20px;">
    <form id="login-form" style="background:#1e1e1e; padding:24px; border-radius:12px; width:100%; max-width:340px; display:flex; flex-direction:column; gap:12px; border:1px solid #333;">
      <h2 style="color:#4caf50; font-size:1.2rem; text-align:center;">🔒 Acceso AMA Podcast</h2>
      <input type="email" id="login-email" placeholder="Correo electrónico" required style="padding:10px; border-radius:8px; border:1px solid #444; background:#121212; color:#fff;">
      <input type="password" id="login-pass" placeholder="Contraseña" required style="padding:10px; border-radius:8px; border:1px solid #444; background:#121212; color:#fff;">
      <button type="submit" style="padding:12px; border:none; border-radius:8px; background:#2e7d32; color:#fff; font-weight:700; cursor:pointer;">Entrar</button>
      <p id="login-error" style="color:#ef5350; font-size:0.85rem; text-align:center; display:none;">Correo o contraseña incorrectos</p>
    </form>
  </div>

  <header class="top-bar">
    <h1>🎙️ AMA Podcast</h1>
    <div class="tabs">
      <button class="tab-btn active" data-bloque="comun">Común (1-12)</button>
      <button class="tab-btn" data-bloque="especifico">Específico (1-25)</button>
    </div>
  </header>

  <main id="lista-episodios" class="episodios-container">
    <!-- Se rellena dinámicamente desde app.js -->
  </main>

  <!-- Reproductor fijo inferior -->
  <footer class="player-bar" id="player-bar">
    <div class="player-info">
      <span id="current-title">Selecciona un tema para escuchar</span>
      <span id="current-percent" class="badge">0%</span>
    </div>

    <div class="progress-container" id="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="time-labels">
      <span id="time-current">00:00</span>
      <span id="time-total">00:00</span>
    </div>

    <div class="controls">
      <button id="btn-speed" class="ctrl-btn speed-btn">1.0x</button>
      <button id="btn-back" class="ctrl-btn">-15s</button>
      <button id="btn-play" class="ctrl-btn play-btn">▶</button>
      <button id="btn-forward" class="ctrl-btn">+15s</button>
      <button id="btn-auto" class="ctrl-btn auto-btn" title="Reproducción continua de pistas">Auto: OFF</button>
      <button id="btn-reset" class="ctrl-btn" title="Reiniciar pista actual">↺</button>
    </div>

    <audio id="audio-engine" preload="metadata"></audio>
  </footer>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .catch((err) => console.error("Error registrando Service Worker:", err));
      });
    }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
